name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z), e.g. v1.19.2'
        required: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag '${TAG_INPUT}': expected vMAJOR.MINOR.PATCH (e.g. v1.19.2)"
            exit 1
          fi
          echo "tag input OK: $TAG_INPUT"

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 60   # 30 分钟为软红线（超出需排查，非硬失败），60 为挂死保护（决策 D-3）
    strategy:
      fail-fast: false
      matrix:
        include:
          # -------------------------------------------------------------------
          # [D6-ia32 留痕] ia32 两行已移除，禁止静默恢复。
          # 裁决状态：D6-ia32 待人工裁决（docs/dependency-upgrade-plan.md 决策记录区）。
          # 证据（2026-11-14 实测）：
          #   - win32: electron-v45.3.2-win32-ia32.zip 返回 404，
          #     Electron 45 不发布该二进制
          #   - linux-ia32 自 Electron 4 起停止支持
          # 若裁决推翻（恢复 ia32）：先更新升级文档 10.4，再取消以下两行注释：
          #   - { os: windows-latest, platform: win32, arch: ia32 }
          #   - { os: ubuntu-22.04, platform: linux, arch: ia32 }
          # -------------------------------------------------------------------
          - { os: windows-latest, platform: win32, arch: x64 }
          - { os: ubuntu-22.04, platform: linux, arch: x64 }
          # macos-14 runner 已被 GitHub 淘汰（"configuration not supported"，2026-11-20 实测），
          # 升级为 macos-15（同为 arm64，交叉构建 darwin-x64 行为一致）
          - { os: macos-15, platform: darwin, arch: x64, optional: true }
    # -----------------------------------------------------------------------
    # [镜像决策留痕] 本 CI 显式不设置以下镜像变量：
    #   ELECTRON_MIRROR / ELECTRON_BUILDER_BINARIES_MIRROR / npm_config_registry
    # 理由：GitHub runner 位于海外，官方源（registry.npmjs.org /
    # github electron releases）原生可达且更快；镜像变量仅属本地 Makefile 链路。
    # 若未来实测反转，经升级文档 10.4 记录后方可恢复，禁止顺手加回。
    # -----------------------------------------------------------------------
    steps:
      - name: Checkout tag source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Node 大版本钉选 24（非精确 patch）：
      #   - 与 Electron 45.3.2 内置 Node 24.22.2 大版本对齐（构建期与产物运行期一致）
      #   - 满足 engines.node >=22；不钉 patch 以避免 runner 侧版本漂移维护成本
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (npm ci)
        shell: bash
        run: |
          set +e
          node -v
          npm -v
          npm config get registry
          # Windows 生成的 lock 可能缺少跨平台 optional（如 @emnapi/*），先在当前平台补齐 lock 再严格 ci
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 2>&1 | tee npm-lock.log
          npm ci 2>&1 | tee npm-ci.log
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            SUMMARY=$(grep -E "npm ERR|ERESOLVE|EUSAGE|error" npm-ci.log | head -12 | paste -sd ' ' - | cut -c1-900)
            echo "::error::npm ci failed: ${SUMMARY}"
            exit 1
          fi

      - name: Build (with dist deps)
        run: npm run build:full

      - name: Test (ava gate)
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee ava.log
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            # 失败摘要注入 check annotation（匿名 API 可读，免 token 自助诊断）
            FAIL_LINES=$(grep -E "✘|\[fail\]|failed|Error:" ava.log | head -25 | tr '\n' ' ' | cut -c1-900)
            echo "::error::ava failed: ${FAIL_LINES}"
            # 诊断增强：失败用例完整报告块（含 expected/actual diff，annotation 上限 4096 内截断）
            FAIL_DETAIL=$(grep -A45 "✘ \[fail\]" ava.log | tr '\n' ' ' | tr -d '\r' | cut -c1-3600)
            if [ -n "$FAIL_DETAIL" ]; then
              echo "::error::ava fail detail: ${FAIL_DETAIL}"
            fi
            exit 1
          fi

      - name: Package (electron-builder)
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          ELECTRON_RUN_AS_NODE: ''
        run: |
          case "$PLATFORM" in
            win32)  TARGET=win ;;
            linux)  TARGET=linux ;;
            darwin) TARGET=mac ;;
          esac
          # --publish never：禁用 electron-builder 的 implicit publishing
          # （tag push 时它会自动尝试发布并要求 GH_TOKEN，报错
          #   "GitHub Personal Access Token is not set"，2026-11-20 mac job 实测；
          #  发布统一由 release job 通过 artifacts 完成）
          npx electron-builder --"$TARGET" --"$ARCH" --publish never

      # E2E 豁免留痕：仅在 win32-x64 job 执行（Windows runner 具交互桌面会话，
      # 可直接启动 Electron；Linux runner 无显示服务需 xvfb（本次不引入）；
      # mac runner 成本高，不做重复覆盖）
      - name: E2E (Playwright, win64 only)
        if: matrix.platform == 'win32' && matrix.arch == 'x64'
        env:
          ELECTRON_RUN_AS_NODE: ''
        run: npx playwright test

      - name: Archive (canonical names)
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          case "$PLATFORM" in
            win32)  SRC="build/oss-browser-${VERSION}-win.zip" ;;
            linux)  SRC="build/oss-browser-${VERSION}-linux.zip" ;;
            darwin) SRC="build/oss-browser-${VERSION}-mac.zip" ;;
          esac

          if [ ! -f "$SRC" ]; then
            echo "::error::Expected builder output not found: ${SRC} (electron-builder artifactName drift? see spec 5.5.1-2)"
            exit 1
          fi

          mkdir -p "releases/$VERSION"
          cp "$SRC" "releases/$VERSION/oss-browser-${PLATFORM}-${ARCH}.zip"
          echo "archived: releases/$VERSION/oss-browser-${PLATFORM}-${ARCH}.zip"

          if [ "$PLATFORM" = "darwin" ]; then
            DMG_SRC="build/oss-browser-${VERSION}-mac.dmg"
            if [ ! -f "$DMG_SRC" ]; then
              echo "::error::Expected dmg output not found: ${DMG_SRC} (dmg target failed while zip succeeded - job fails, darwin optional semantics applies, see spec 5.5.1-3)"
              exit 1
            fi
            cp "$DMG_SRC" "releases/$VERSION/oss-browser.dmg"
            echo "archived: releases/$VERSION/oss-browser.dmg"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oss-browser-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            releases/**/*.zip
            releases/**/*.dmg
          if-no-files-found: error

  release:
    needs: [validate, build]
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify build artifacts exist
        run: |
          set -euo pipefail
          count=$(find artifacts -type f \( -name '*.zip' -o -name '*.dmg' \) | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No build artifacts found - all platform builds failed, release aborted (spec 5.7.1-2)"
            exit 1
          fi
          echo "artifacts to publish: $count"
          find artifacts -type f \( -name '*.zip' -o -name '*.dmg' \) -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
          generate_release_notes: true
