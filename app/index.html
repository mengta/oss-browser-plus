<!DOCTYPE html>
<html ng-app="web" ng-controller="mainCtrl" ng-csp>
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-hwKS3cEKvlWGBmabWLMlhHZQXWJ3uwRfrvnlWoP0RJM=' 'sha256-pUhfbXp1I/T6lkr0fNIHRH+4X8mE3VPZpSONDPe1/H0=' 'sha256-1txp5IDa2RJP+jXGrosDGOtSQXGck2ebC1g6qu7wz34=' 'sha256-N5INwltTfLgEQzTBWK87iWj1jnlxlGQfNLgBt9O9eKg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: http://127.0.0.1:* http://localhost:*; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; font-src 'self' data:" />
    <meta charset="utf-8" />
    <style>
      #vue-app {
        display: none;
      }
      body.vue-mode #vue-app {
        display: block;
      }
      body.vue-modal-open #vue-app {
        display: block;
      }
    </style>
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width"
    />
    <title>OSS Browser</title>
    <script>
      var __boot =
        window.ossBrowser && window.ossBrowser.bootstrap
          ? window.ossBrowser.bootstrap.get()
          : null;
      var __bootData = __boot && __boot.ok ? __boot.data : {};
      document.title = __bootData.appTitle || "OSS Browser";

      var Global = {
        app: {
          id: __bootData.appId || "oss-browser",
          logo: __bootData.logo || "icons/icon.png",
          version: __bootData.appVersion || "0.0.0",
        },
        i18n: __bootData.locales || {},
        config_path: __bootData.configPath || "",
        release_notes_url: __bootData.releaseNotesUrl,
        upgrade_url: __bootData.upgradeUrl,
        about_html: __bootData.aboutHtml,
      };
      (function () {
        if (__bootData.appName)
          for (var k in __bootData.appName) {
            if (Global.i18n[k])
              Global.i18n[k].content["app.name"] =
                __bootData.appName[k] || "OSS Browser";
          }
      })();
    </script>
    <!-- <link href="icons/icon.ico" rel="shortcut icon"/> -->
    <link href="css/lib.css" rel="stylesheet" />
    <link href="app.css" rel="stylesheet" />
  </head>
  <body>
    <!-- <div ng-include="'main/_/loading.html'"></div>  -->
    <toast-list></toast-list>

    <div ui-view="">
      <!-- loading -->
      <section
        style="
          text-align: center;
          display: block;
          width: 128px;
          height: 120px;
          margin: 250px auto 0;
        "
      >
        <div class="loadEffect">
          <div><span></span></div>
          <div><span></span></div>
          <div><span></span></div>
          <div><span></span></div>
        </div>
      </section>
    </div>

    <!-- Insert this line above script imports  -->
    <script>
      if (typeof module === "object") {
        window.module = module;
        module = undefined;
      }
    </script>
    <script src="lib.js"></script>

    <!-- Insert this line after script imports -->
    <script>
      if (window.module) module = window.module;
    </script>

    <script src="aliyun-sdk-oss.js"></script>
    <script src="templates.js"></script>
    <script>
      var isDev = __bootData.isDev === true;

      //静态服务端口：就绪后写入 Global（VR-01-05）
      setTimeout(function () {
        window.ossBrowser.system
          .getStaticServerPort()
          .then(function (r) {
            if (r && r.ok) Global.staticServerPort = r.data;
          })
          .catch(function (e) {
            console.log("getStaticServerPort failed:", e);
          });
      }, 1000);

      //自动升级
      // setTimeout(function(){
      //   ipcRenderer.send('asynchronous-message', 'checkUpgrade');
      // },2000);
      // setInterval(function(){
      //   ipcRenderer.send('asynchronous-message', 'checkUpgrade');
      // },60000);

      function openExternal(url) {
        return window.ossBrowser.system.openExternal(url);
      }
      function openLocaleFolder(p) {
        return window.ossBrowser.system.showItemInFolder(p);
      }

      function openDevTools() {
        return window.ossBrowser.system.openDevTools();
      }
      function gInstallAndRestart(version) {
        return window.ossBrowser.system.installAndRestart(version);
      }


      $(function () {
        $(document).on("dragover", function (ev) {
          ev.preventDefault();
          return false;
        });
        $(document).on("drop", function (ev) {
          ev.preventDefault();
          return false;
        });
      });

      //require('./node/crc64/test')
    </script>
    <div id="vue-app"></div>
    <script src="renderer.js"></script>
    <script src="app.js"></script>
  </body>
</html>
