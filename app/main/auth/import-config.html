<div class="modal-header">
  <button type="button" class="close" ng-click="cancel()">
    <span aria-hidden="true">&times;</span>
  </button>
  <h4 class="modal-title">
    <i class="fa fa-cloud-download text-success"></i>
    {{'auth.importConfig'|translate}}
  </h4>
</div>
<div class="modal-body">
  <p class="small text-muted">
    {{'auth.importConfig.hint'|translate}}
  </p>

  <textarea
    class="form-control"
    rows="8"
    ng-model="text"
    ng-change="doParse()"
    ng-model-options="{debounce: 300}"
    placeholder="{{'auth.importConfig.placeholder'|translate}}"
  ></textarea>

  <div
    ng-if="parseError"
    class="text-danger small"
    style="margin-top: 8px"
  >
    <i class="fa fa-warning"></i>
    {{parseError}}
  </div>

  <div ng-if="parsed" class="panel panel-default" style="margin: 10px 0 0">
    <table class="mg0 table table-bordered table-striped table-condensed">
      <tr ng-repeat="(k, v) in parsed">
        <td style="width: 180px"><b>{{fieldLabel(k)}}</b></td>
        <td>
          <code ng-if="k=='secret' && !showSecret">{{v|hideSecret}}</code>
          <code ng-if="k!='secret' || showSecret">{{v}}</code>
          <a href="" ng-if="k=='secret'" ng-click="showSecret=!showSecret">
            <i
              class="fa"
              ng-class="{'fa-eye':!showSecret, 'fa-eye-slash':showSecret}"
            ></i>
          </a>
        </td>
      </tr>
    </table>
  </div>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-default btn-sm"
    ng-click="cancel()"
  >
    <i class="glyphicon glyphicon-remove"></i>
    {{'close'|translate}}
  </button>
  <button
    type="button"
    class="btn btn-success btn-sm"
    ng-disabled="!parsed"
    ng-click="doImport()"
  >
    <i class="fa fa-check"></i>
    {{'auth.importConfig.import'|translate}}
  </button>
</div>
