<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>player</title>
  <style>
  body{
    margin:0px;
    text-align:center;
  }
  .player{
    height:auto;
    max-height:100%;
    max-width:100%;
    width: auto;
  }
  </style>

</head>

<body>

  <video id="myFlvPlayer" class="player" controls></video>

  <script src="flv.js"></script>
  <script>
  var flvPlayer;
  init();
  function init(){
    var sch = parseSearch();
    var src = sch ? sch.src : '';
    src = decodeURIComponent(src);
    if(!src)return;

    var playerEl = document.getElementById('myFlvPlayer');

    // P1：去除 jQuery 依赖（jquery.min.js 已下线），改用原生 DOM 尺寸 API
    window.onresize = function(){
      var pw = playerEl.clientWidth || playerEl.videoWidth || 0;
      var ph = playerEl.clientHeight || playerEl.videoHeight || 0;
      var w = window.innerWidth;
      var h = window.innerHeight;

      if(pw && ph && w/h > pw/ph){
        playerEl.style.height = h + 'px';
        playerEl.style.width = 'auto';
      }else{
        playerEl.style.width = w + 'px';
        playerEl.style.height = 'auto';
      }
    }


    if (typeof flvPlayer !== "undefined") {
        if (flvPlayer != null) {
            flvPlayer.unload();
            flvPlayer.detachMediaElement();
            flvPlayer.destroy();
            flvPlayer = null;
        }
    }
    flvPlayer = flvjs.createPlayer({
      type: 'flv',
       url: src
    });
    flvPlayer.attachMediaElement(playerEl);

    flvPlayer.load();
    if(sch.autoplay=='autoplay') flvPlayer.play();
  }

  function parseSearch(){
    var sch = window.location.search;
    sch = sch.trim();
    if(!sch)return '';

    sch = sch.replace(/^\?/,'');
    var kvs = sch.split('&');
    var m = {};

    for(var i=0;i<kvs.length; i++){
      var ind = kvs[i].indexOf('=');
      var k = kvs[i].substring(0,ind);
      var v = ind!=-1 ? kvs[i].substring(ind+1) : '';
      m[k]=v;
    }
    return m;
  }
  </script>
</body>
</html>
